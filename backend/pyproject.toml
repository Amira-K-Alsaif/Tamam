[project]
name = "tamam-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.159.1",
  "uvicorn[standard]==0.54.0",
  "pydantic-settings==2.16.1",
  "langchain-core==1.7.6",
  "langchain-text-splitters==1.1.3",
  "langchain-google-genai==4.4.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "httpx==0.28.1",
  "ruff==0.17.1",
]

# The embedding model is heavy, so CI and modules that do not need it skip this extra.
rag = [
  "sentence-transformers==6.2.0",
]

knowledge = [
  "docling==2.148.0",
  "python-dotenv==1.2.4",
  "supabase==2.34.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
